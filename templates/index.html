<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizGenius — AI Quiz Bot</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="app">

    <!-- SETUP -->
    <section id="setup-screen" class="screen active">
      <header class="app-header">
        <div class="avatar">🧠</div>
        <div>
          <h1>QuizGenius</h1>
          <p class="status">AI quiz bot • online</p>
        </div>
        <button class="sound-toggle" id="sound-toggle" onclick="toggleSound()" title="Toggle sound">🔊</button>
      </header>

      <div class="setup-body">
        <label class="field-label">Paste notes or upload PDF / Image</label>
        <textarea id="notes-input" rows="6" placeholder="Paste a chapter, lecture notes, or syllabus here..."></textarea>

        <div class="file-upload-box">
          <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.webp" hidden>
          <button type="button" class="btn-ghost" onclick="document.getElementById('file-input').click()">
            📎 Attach PDF or Image
          </button>
          <span id="file-name-display" class="file-name"></span>
        </div>
        <p class="hint" id="file-hint"></p>

        <div class="row">
          <div class="field">
            <label class="field-label">Questions (1–50)</label>
            <input type="number" id="num-questions" value="5" min="1" max="50">
          </div>
          <div class="field">
            <label class="field-label">Difficulty</label>
            <select id="difficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
        </div>

        <button id="start-btn" class="btn-primary ripple" onclick="startQuiz()">
          <span>Start Quiz →</span>
        </button>
        <p id="setup-error" class="error-text"></p>
      </div>
    </section>

    <!-- LOADING -->
    <section id="loading-screen" class="screen">
      <div class="loader-wrap">
        <div class="loader"></div>
        <p id="loading-text">Generating your quiz...</p>
        <p class="hint" id="loading-subtext"></p>
      </div>
    </section>

    <!-- QUIZ -->
    <section id="quiz-screen" class="screen">
      <div class="progress-bar-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div class="quiz-topbar">
        <span id="question-counter">Q1 / 5</span>
        <div class="topbar-right">
          <span id="streak-display" class="streak hidden">🔥 <span id="streak-count">0</span></span>
          <span id="timer" class="timer">⏱ 30s</span>
        </div>
      </div>

      <div class="chat-area">
        <div class="bubble bot-bubble">
          <p id="question-text"></p>
        </div>
        <div id="options-container" class="options-container"></div>
        <div id="explanation-box" class="explanation hidden"></div>
      </div>

      <button id="next-btn" class="btn-primary hidden ripple" onclick="nextQuestion()">
        <span>Next Question →</span>
      </button>
    </section>

    <!-- RESULTS -->
    <section id="results-screen" class="screen">
      <div class="results-card">
        <div id="score-circle" class="score-circle">
          <span id="score-percent">0%</span>
        </div>
        <h2 id="score-title">Quiz Complete</h2>
        <p id="score-detail" class="score-detail"></p>

        <div class="review-list" id="review-list"></div>

        <button class="btn-primary ripple" onclick="location.reload()">
          <span>Take Another Quiz 🔄</span>
        </button>
      </div>
    </section>

  </div>

  <script>
    /* ---------- STATE ---------- */
    let quiz = [];
    let currentIndex = 0;
    let userAnswers = [];
    let timerInterval = null;
    let timeLeft = 30;
    let currentStreak = 0;
    let longestStreak = 0;
    let soundEnabled = true;
    const TIME_PER_QUESTION = 30;

    /* ---------- SOUND (Web Audio API, no files) ---------- */
    let audioCtx = null;
    function beep(freq, duration, type = "sine", gain = 0.15) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.value = gain;
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }
    function playCorrect() {
      beep(880, 0.12, "sine", 0.15);
      setTimeout(() => beep(1320, 0.18, "sine", 0.12), 100);
    }
    function playWrong() {
      beep(220, 0.2, "sawtooth", 0.12);
      setTimeout(() => beep(160, 0.3, "sawtooth", 0.1), 120);
    }
    function playFinish() {
      [523, 659, 784, 1047].forEach((f, i) =>
        setTimeout(() => beep(f, 0.2, "sine", 0.14), i * 120)
      );
    }
    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById("sound-toggle").textContent = soundEnabled ? "🔊" : "🔇";
    }

    /* ---------- VIBRATION ---------- */
    function vibrate(pattern) {
      if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    /* ---------- CONFETTI ---------- */
    function burstConfetti(x = 0.5, y = 0.6) {
      if (typeof confetti !== "function") return;
      confetti({
        particleCount: 60,
        spread: 80,
        origin: { x, y },
        colors: ["#2aabee", "#2ecc71", "#f39c12", "#e74c3c", "#9b59b6"],
        scalar: 0.9,
        gravity: 1.2,
        drift: 0.3
      });
    }
    function celebrationConfetti() {
      if (typeof confetti !== "function") return;
      const duration = 3000;
      const end = Date.now() + duration;
      (function frame() {
        confetti({
          particleCount: 6,
          angle: 60,
          spread: 70,
          origin: { x: 0, y: 0.7 },
          colors: ["#2aabee", "#2ecc71", "#f39c12"]
        });
        confetti({
          particleCount: 6,
          angle: 120,
          spread: 70,
          origin: { x: 1, y: 0.7 },
          colors: ["#e74c3c", "#9b59b6", "#f39c12"]
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
      confetti({
        particleCount: 150,
        spread: 160,
        origin: { y: 0.5 },
        startVelocity: 45
      });
    }

    /* ---------- FILE INPUT ---------- */
    document.getElementById("file-input").addEventListener("change", function () {
      const f = this.files[0];
      const nameEl = document.getElementById("file-name-display");
      const hintEl = document.getElementById("file-hint");
      if (!f) {
        nameEl.textContent = "";
        hintEl.textContent = "";
        return;
      }
      const sizeMB = (f.size / 1024 / 1024).toFixed(2);
      nameEl.textContent = `${f.name} (${sizeMB} MB)`;
      if (f.size > 25 * 1024 * 1024) {
        hintEl.textContent = "⚠️ File is over 25MB. Please choose a smaller file.";
        hintEl.style.color = "#e74c3c";
      } else if (f.size > 10 * 1024 * 1024) {
        hintEl.textContent = "⏳ Large file — generation may take a bit longer.";
        hintEl.style.color = "#f39c12";
      } else {
        hintEl.textContent = "";
      }
    });

    /* ---------- HELPERS ---------- */
    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* ---------- START ---------- */
    async function startQuiz() {
      const text = document.getElementById("notes-input").value.trim();
      const num = parseInt(document.getElementById("num-questions").value) || 5;
      const diff = document.getElementById("difficulty").value;
      const fileInput = document.getElementById("file-input");
      const err = document.getElementById("setup-error");

      const hasFile = fileInput.files.length > 0;
      const file = hasFile ? fileInput.files[0] : null;

      if (text.length < 50 && !hasFile) {
        err.textContent = "Please paste text or attach a file.";
        return;
      }
      if (file && file.size > 25 * 1024 * 1024) {
        err.textContent = "File too large (max 25MB).";
        return;
      }
      err.textContent = "";

      showScreen("loading-screen");
      const loadingText = document.getElementById("loading-text");
      const loadingSub = document.getElementById("loading-subtext");
      loadingText.textContent = "Generating your quiz...";
      loadingSub.textContent = num > 20
        ? `Creating ${num} questions — this may take ~${Math.ceil(num / 10) * 5}s`
        : "";

      const formData = new FormData();
      formData.append("text", text);
      formData.append("num_questions", num);
      formData.append("difficulty", diff);
      if (hasFile) formData.append("file", file);

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 90000);

      try {
        const res = await fetch("/generate", {
          method: "POST",
          body: formData,
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        let data;
        try {
          data = await res.json();
        } catch (e) {
          showScreen("setup-screen");
          err.textContent = "❌ Server returned an unexpected response.";
          return;
        }

        if (!res.ok || data.error) {
          showScreen("setup-screen");
          err.textContent = "❌ " + (data.error || `Server error (${res.status})`);
          return;
        }

        quiz = data.quiz;
        currentIndex = 0;
        userAnswers = [];
        currentStreak = 0;
        longestStreak = 0;
        updateStreakDisplay();
        showScreen("quiz-screen");
        renderQuestion();

      } catch (e) {
        clearTimeout(timeoutId);
        showScreen("setup-screen");
        if (e.name === "AbortError") {
          err.textContent = "❌ Request timed out. Try fewer questions or a smaller file.";
        } else {
          err.textContent = "❌ Network error. Please try again.";
        }
      }
    }

    /* ---------- STREAK ---------- */
    function updateStreakDisplay() {
      const el = document.getElementById("streak-display");
      document.getElementById("streak-count").textContent = currentStreak;
      el.classList.toggle("hidden", currentStreak < 2);
      if (currentStreak >= 2) {
        el.classList.remove("streak-pop");
        void el.offsetWidth;
        el.classList.add("streak-pop");
      }
    }

    /* ---------- RENDER ---------- */
    function renderQuestion() {
      const q = quiz[currentIndex];

      const progress = (currentIndex / quiz.length) * 100;
      document.getElementById("progress-bar").style.width = progress + "%";
      document.getElementById("question-counter").textContent = `Q${currentIndex + 1} / ${quiz.length}`;
      document.getElementById("question-text").textContent = q.question;

      const container = document.getElementById("options-container");
      container.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.onclick = () => selectAnswer(i);
        container.appendChild(btn);
      });

      document.getElementById("explanation-box").classList.add("hidden");
      document.getElementById("next-btn").classList.add("hidden");

      startTimer();
    }

    /* ---------- TIMER ---------- */
    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = TIME_PER_QUESTION;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          selectAnswer(-1);
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const el = document.getElementById("timer");
      el.textContent = `⏱ ${timeLeft}s`;
      el.classList.toggle("timer-warn", timeLeft <= 10);
    }

    /* ---------- ANSWER ---------- */
    function selectAnswer(selectedIndex) {
      clearInterval(timerInterval);

      const q = quiz[currentIndex];
      const correctIndex = q.correct;
      const buttons = document.querySelectorAll(".option-btn");

      buttons.forEach(b => b.disabled = true);

      buttons.forEach((btn, i) => {
        if (i === correctIndex) btn.classList.add("correct", "pop");
        if (i === selectedIndex && selectedIndex !== correctIndex) {
          btn.classList.add("wrong", "shake");
        }
      });

      const isCorrect = selectedIndex === correctIndex;

      if (isCorrect) {
        currentStreak++;
        if (currentStreak > longestStreak) longestStreak = currentStreak;
      } else {
        currentStreak = 0;
      }
      updateStreakDisplay();

      userAnswers.push({
        question: q.question,
        selected: selectedIndex,
        correct: correctIndex,
        isCorrect: isCorrect
      });

      if (isCorrect) {
        playCorrect();
        vibrate([80]);
        const btn = buttons[selectedIndex];
        const rect = btn.getBoundingClientRect();
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;
        burstConfetti(x, y);
      } else if (selectedIndex === -1) {
        playWrong();
        vibrate([300, 100, 300]);
      } else {
        playWrong();
        vibrate([200, 80, 200]);
      }

      const exp = document.getElementById("explanation-box");
      exp.innerHTML = `
        <strong>${isCorrect ? "✅ Correct!" : "❌ " + (selectedIndex === -1 ? "Time's up!" : "Incorrect")}</strong>
        <p>${q.explanation || "Correct answer: " + q.options[correctIndex]}</p>
      `;
      exp.classList.remove("hidden");
      exp.classList.add(isCorrect ? "exp-correct" : "exp-wrong");

      const nextBtn = document.getElementById("next-btn");
      nextBtn.classList.remove("hidden");
      nextBtn.querySelector("span").textContent = (currentIndex === quiz.length - 1)
        ? "See Results 📊" : "Next Question →";
    }

    /* ---------- NEXT ---------- */
    function nextQuestion() {
      currentIndex++;
      if (currentIndex < quiz.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    /* ---------- RESULTS ---------- */
    function showResults() {
      const total = quiz.length;
      const correctCount = userAnswers.filter(a => a.isCorrect).length;
      const percent = Math.round((correctCount / total) * 100);

      document.getElementById("score-percent").textContent = percent + "%";
      document.getElementById("score-detail").textContent =
        `You answered ${correctCount} out of ${total} correctly.` +
        (longestStreak >= 3 ? ` Longest streak: ${longestStreak} 🔥` : "");

      let title = "Keep Practicing 💪";
      if (percent === 100) title = "Perfect Score! 🏆";
      else if (percent >= 80) title = "Excellent! 🌟";
      else if (percent >= 60) title = "Good Job! 👍";
      document.getElementById("score-title").textContent = title;

      const circle = document.getElementById("score-circle");
      circle.style.background = percent >= 80
        ? "linear-gradient(135deg,#2ecc71,#27ae60)"
        : percent >= 60
        ? "linear-gradient(135deg,#f39c12,#e67e22)"
        : "linear-gradient(135deg,#e74c3c,#c0392b)";

      if (percent >= 80) {
        celebrationConfetti();
        playFinish();
        vibrate([100, 50, 100, 50, 200]);
      } else if (percent >= 60) {
        burstConfetti(0.5, 0.5);
        vibrate([100]);
      }

      const review = document.getElementById("review-list");
      review.innerHTML = "<h3>Review</h3>";
      userAnswers.forEach((a, i) => {
        const div = document.createElement("div");
        div.className = "review-item " + (a.isCorrect ? "rev-correct" : "rev-wrong");
        div.innerHTML = `
          <p class="review-q"><strong>Q${i + 1}.</strong> ${a.question}</p>
          <p class="review-a">
            ${a.isCorrect
              ? "✅ You answered correctly"
              : `❌ You chose: ${a.selected === -1 ? "— (no answer)" : quiz[i].options[a.selected]}<br>✅ Correct: ${quiz[i].options[a.correct]}`}
          </p>
        `;
        review.appendChild(div);
      });

      showScreen("results-screen");
    }

    /* ---------- RIPPLE ---------- */
    document.addEventListener("click", (e) => {
      const target = e.target.closest(".ripple, .option-btn");
      if (!target) return;
      const rect = target.getBoundingClientRect();
      const ripple = document.createElement("span");
      const size = Math.max(rect.width, rect.height);
      ripple.className = "ripple-effect";
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
      ripple.style.top = (e.clientY - rect.top - size / 2) + "px";
      target.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  </script>
</body>
</html>
