<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizGenius — AI Quiz Generator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🧠 QuizGenius</h1>
      <p class="tagline">Paste your notes. Get an instant quiz.</p>
    </header>

    <section id="input-section">
      <textarea
        id="notes-input"
        placeholder="Paste your notes, syllabus, or any study material here..."
        rows="10"
      ></textarea>
      <button id="generate-btn" onclick="generateQuiz()">
        Generate Quiz ✨
      </button>
      <p id="status-message"></p>
    </section>

    <section id="quiz-section" class="hidden">
      <div id="quiz-container"></div>
      <button id="submit-btn" onclick="submitQuiz()" class="hidden">
        Submit Answers
      </button>
      <div id="results-container" class="hidden"></div>
    </section>
  </div>

  <script>
    let currentQuiz = [];

    async function generateQuiz() {
      const text = document.getElementById("notes-input").value.trim();
      const status = document.getElementById("status-message");
      const btn = document.getElementById("generate-btn");

      if (text.length < 50) {
        status.textContent = "Please paste at least a paragraph of notes.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Generating... ⏳";
      status.textContent = "Sending your notes to Gemini...";

      try {
        const response = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text })
        });

        const data = await response.json();

        if (data.error) {
          status.textContent = "Error: " + data.error;
          btn.disabled = false;
          btn.textContent = "Generate Quiz ✨";
          return;
        }

        currentQuiz = data.quiz;
        displayQuiz(currentQuiz);
        status.textContent = "";

      } catch (err) {
        status.textContent = "Something went wrong. Please try again.";
        btn.disabled = false;
        btn.textContent = "Generate Quiz ✨";
      }
    }

    function displayQuiz(quiz) {
      const container = document.getElementById("quiz-container");
      container.innerHTML = "";

      quiz.forEach((q, index) => {
        const block = document.createElement("div");
        block.className = "question-block";

        let optionsHTML = "";
        q.options.forEach((opt, optIndex) => {
          optionsHTML += `
            <label class="option">
              <input type="radio" name="q${index}" value="${optIndex}">
              ${opt}
            </label>
          `;
        });

        block.innerHTML = `
          <h3>Q${index + 1}. ${q.question}</h3>
          <div class="options">${optionsHTML}</div>
        `;

        container.appendChild(block);
      });

      document.getElementById("input-section").classList.add("hidden");
      document.getElementById("quiz-section").classList.remove("hidden");
      document.getElementById("submit-btn").classList.remove("hidden");
    }

    function submitQuiz() {
      let score = 0;
      let resultsHTML = "<h2>Results 📊</h2>";

      currentQuiz.forEach((q, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const userAnswer = selected ? parseInt(selected.value) : -1;

        if (userAnswer === q.correct) {
          score++;
          resultsHTML += `<p class="correct">✅ Q${index + 1}: Correct</p>`;
        } else {
          resultsHTML += `<p class="wrong">❌ Q${index + 1}: Wrong. Correct answer: ${q.options[q.correct]}</p>`;
        }
      });

      resultsHTML += `<p class="score">You scored ${score} / ${currentQuiz.length}</p>`;
      resultsHTML += `<button onclick="location.reload()">Try Another Quiz 🔄</button>`;

      const resultsContainer = document.getElementById("results-container");
      resultsContainer.innerHTML = resultsHTML;
      resultsContainer.classList.remove("hidden");
      document.getElementById("submit-btn").classList.add("hidden");
    }
  </script>
</body>
</html>
