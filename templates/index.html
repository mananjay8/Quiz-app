<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizGenius — AI Quiz Bot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">

    <!-- ============ SETUP SCREEN ============ -->
    <section id="setup-screen" class="screen active">
      <header class="app-header">
        <div class="avatar">🧠</div>
        <div>
          <h1>QuizGenius</h1>
          <p class="status">AI quiz bot • online</p>
        </div>
      </header>

      <div class="setup-body">
        <label class="field-label">Paste notes, or upload a PDF / Image</label>
        <textarea id="notes-input" rows="6" placeholder="Paste a chapter, lecture notes, or syllabus here..."></textarea>
        
        <div class="file-upload-box">
          <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.webp" hidden>
          <button type="button" class="btn-ghost" onclick="document.getElementById('file-input').click()">
            📎 Attach PDF or Image
          </button>
          <span id="file-name-display" class="file-name"></span>
        </div>

        <div class="row">
          <div class="field">
            <label class="field-label">Number of Questions (Max 50)</label>
            <input type="number" id="num-questions" value="5" min="1" max="50">
          </div>
          <div class="field">
            <label class="field-label">Difficulty</label>
            <select id="difficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
        </div>

        <button id="start-btn" class="btn-primary" onclick="startQuiz()">
          Start Quiz →
        </button>
        <p id="setup-error" class="error-text"></p>
      </div>
    </section>

    <!-- ============ LOADING SCREEN ============ -->
    <section id="loading-screen" class="screen">
      <div class="loader-wrap">
        <div class="loader"></div>
        <p>Generating your quiz...</p>
      </div>
    </section>

    <!-- ============ QUIZ SCREEN ============ -->
    <section id="quiz-screen" class="screen">
      <div class="progress-bar-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div class="quiz-topbar">
        <span id="question-counter">Q1 / 5</span>
        <span id="timer" class="timer">⏱ 30s</span>
      </div>

      <div class="chat-area">
        <div class="bubble bot-bubble">
          <p id="question-text"></p>
        </div>
        <div id="options-container" class="options-container"></div>
        <div id="explanation-box" class="explanation hidden"></div>
      </div>

      <button id="next-btn" class="btn-primary hidden" onclick="nextQuestion()">
        Next Question →
      </button>
    </section>

    <!-- ============ RESULTS SCREEN ============ -->
    <section id="results-screen" class="screen">
      <div class="results-card">
        <div id="score-circle" class="score-circle">
          <span id="score-percent">0%</span>
        </div>
        <h2 id="score-title">Quiz Complete</h2>
        <p id="score-detail" class="score-detail"></p>

        <div id="review-list" class="review-list"></div>

        <button class="btn-primary" onclick="location.reload()">
          Take Another Quiz 🔄
        </button>
      </div>
    </section>

  </div>

  <script>
    /* ---------- STATE ---------- */
    let quiz = [];
    let currentIndex = 0;
    let userAnswers = [];
    let timerInterval = null;
    let timeLeft = 30;
    const TIME_PER_QUESTION = 30;

    /* ---------- FILE INPUT DISPLAY ---------- */
    document.getElementById('file-input').addEventListener('change', function() {
        const name = this.files[0] ? this.files[0].name : '';
        document.getElementById('file-name-display').textContent = name;
    });

    /* ---------- HELPERS ---------- */
    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* ---------- START ---------- */
    async function startQuiz() {
      const text = document.getElementById("notes-input").value.trim();
      const num = parseInt(document.getElementById("num-questions").value) || 5;
      const diff = document.getElementById("difficulty").value;
      const fileInput = document.getElementById("file-input");
      const err = document.getElementById("setup-error");

      const hasFile = fileInput.files.length > 0;

      if (text.length < 50 && !hasFile) {
        err.textContent = "Please paste text or attach a file.";
        return;
      }
      err.textContent = "";

      showScreen("loading-screen");

      const formData = new FormData();
      formData.append("text", text);
      formData.append("num_questions", num);
      formData.append("difficulty", diff);
      if (hasFile) {
        formData.append("file", fileInput.files[0]);
      }

      try {
        const res = await fetch("/generate", {
          method: "POST",
          body: formData
        });
        const data = await res.json();

        if (data.error) {
          showScreen("setup-screen");
          err.textContent = "❌ " + data.error;
          return;
        }

        quiz = data.quiz;
        currentIndex = 0;
        userAnswers = [];
        showScreen("quiz-screen");
        renderQuestion();

      } catch (e) {
        showScreen("setup-screen");
        err.textContent = "❌ Network error. Please try again.";
      }
    }

    /* ---------- RENDER ONE QUESTION ---------- */
    function renderQuestion() {
      const q = quiz[currentIndex];

      const progress = ((currentIndex) / quiz.length) * 100;
      document.getElementById("progress-bar").style.width = progress + "%";
      document.getElementById("question-counter").textContent = `Q${currentIndex + 1} / ${quiz.length}`;
      document.getElementById("question-text").textContent = q.question;

      const container = document.getElementById("options-container");
      container.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.onclick = () => selectAnswer(i);
        container.appendChild(btn);
      });

      document.getElementById("explanation-box").classList.add("hidden");
      document.getElementById("next-btn").classList.add("hidden");

      startTimer();
    }

    /* ---------- TIMER ---------- */
    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = TIME_PER_QUESTION;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          selectAnswer(-1);
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const el = document.getElementById("timer");
      el.textContent = `⏱ ${timeLeft}s`;
      el.classList.toggle("timer-warn", timeLeft <= 10);
    }

    /* ---------- ANSWER SELECTION ---------- */
    function selectAnswer(selectedIndex) {
      clearInterval(timerInterval);

      const q = quiz[currentIndex];
      const correctIndex = q.correct;
      const buttons = document.querySelectorAll(".option-btn");

      buttons.forEach(b => b.disabled = true);

      buttons.forEach((btn, i) => {
        if (i === correctIndex) btn.classList.add("correct");
        if (i === selectedIndex && selectedIndex !== correctIndex) btn.classList.add("wrong");
      });

      const isCorrect = selectedIndex === correctIndex;
      userAnswers.push({
        question: q.question,
        selected: selectedIndex,
        correct: correctIndex,
        isCorrect: isCorrect
      });

      const exp = document.getElementById("explanation-box");
      exp.innerHTML = `
        <strong>${isCorrect ? "✅ Correct!" : "❌ " + (selectedIndex === -1 ? "Time's up!" : "Incorrect")}</strong>
        <p>${q.explanation || "Correct answer: " + q.options[correctIndex]}</p>
      `;
      exp.classList.remove("hidden");
      exp.classList.add(isCorrect ? "exp-correct" : "exp-wrong");

      const nextBtn = document.getElementById("next-btn");
      nextBtn.classList.remove("hidden");
      nextBtn.textContent = (currentIndex === quiz.length - 1) ? "See Results 📊" : "Next Question →";
    }

    /* ---------- NEXT ---------- */
    function nextQuestion() {
      currentIndex++;
      if (currentIndex < quiz.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    /* ---------- RESULTS ---------- */
    function showResults() {
      const total = quiz.length;
      const correctCount = userAnswers.filter(a => a.isCorrect).length;
      const percent = Math.round((correctCount / total) * 100);

      document.getElementById("score-percent").textContent = percent + "%";
      document.getElementById("score-detail").textContent = `You answered ${correctCount} out of ${total} correctly.`;

      let title = "Keep Practicing 💪";
      if (percent === 100) title = "Perfect Score! 🏆";
      else if (percent >= 80) title = "Excellent! 🌟";
      else if (percent >= 60) title = "Good Job! 👍";
      document.getElementById("score-title").textContent = title;

      const circle = document.getElementById("score-circle");
      circle.style.background = percent >= 80 ? "linear-gradient(135deg,#2ecc71,#27ae60)"
        : percent >= 60 ? "linear-gradient(135deg,#f39c12,#e67e22)"
        : "linear-gradient(135deg,#e74c3c,#c0392b)";

      const review = document.getElementById("review-list");
      review.innerHTML = "<h3>Review</h3>";
      userAnswers.forEach((a, i) => {
        const div = document.createElement("div");
        div.className = "review-item " + (a.isCorrect ? "rev-correct" : "rev-wrong");
        div.innerHTML = `
          <p class="review-q"><strong>Q${i + 1}.</strong> ${a.question}</p>
          <p class="review-a">
            ${a.isCorrect
              ? "✅ You answered correctly"
              : `❌ You chose: ${a.selected === -1 ? "— (no answer)" : quiz[i].options[a.selected]}<br>✅ Correct: ${quiz[i].options[a.correct]}`}
          </p>
        `;
        review.appendChild(div);
      });

      showScreen("results-screen");
    }
  </script>
</body>
</html>
